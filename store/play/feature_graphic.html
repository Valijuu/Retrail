<!doctype html>
<!-- Source of the Play feature graphic (1024 x 500). Render with
     tool/render_store_graphics.sh. Colours are the AppColors light tokens
     (lib/core/theme/app_colors.dart); the mark is assets/branding/retrail_mark.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=block" rel="stylesheet">
<style>
  :root { --bg: #FFEDD5; --blob: #FFD9AE; --title: #431407; --accent: #B45309;
          --chip-bg: #B45309; --chip: #FFFFFF; --bezel: #1C1B1F; --shadow: rgba(67,20,7,.30); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: var(--bg); }
  body { font-family: Fredoka, sans-serif; position: relative; }
  .blob { position: absolute; right: -120px; top: -160px; width: 620px; height: 820px;
          border-radius: 50%; background: var(--blob); }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; width: 540px;
          display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand .mark { height: 96px; width: auto; }
  .name { font-size: 82px; font-weight: 700; letter-spacing: -1px; color: var(--title); }
  .tagline { margin-top: 18px; font-size: 40px; line-height: 1.12; font-weight: 700; color: var(--title); }
  .tagline em { font-style: normal; color: var(--accent); }
  .chips { margin-top: 24px; display: flex; gap: 8px; flex-wrap: nowrap; }
  .chip { background: var(--chip-bg); color: var(--chip); border-radius: 999px;
          padding: 6px 14px; font-size: 17px; font-weight: 600; white-space: nowrap; }
  .phone { position: absolute; width: 196px; background: var(--bezel); padding: 7px;
           border-radius: 36px; box-shadow: 0 18px 40px var(--shadow); }
  .phone img { display: block; width: 100%; border-radius: 30px; }
  #p1 { left: 630px; top: 140px; transform: rotate(-6deg); }
  #p2 { left: 800px; top: 80px; transform: rotate(5deg); }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="phone" id="p1"><img id="img1" alt=""></div>
  <div class="phone" id="p2"><img id="img2" alt=""></div>

  <div class="copy">
    <div class="brand">
      <img class="mark" src="../../assets/branding/retrail_mark.png" alt="">
      <div class="name">Retrail</div>
    </div>
    <div class="tagline" id="tagline"></div>
    <div class="chips" id="chips"></div>
  </div>

  <script>
    const copy = {
      en: { tagline: 'The GPS tracker for<br><em>everything on wheels</em>',
            chips: ['Longboard', 'Skateboard', 'Inline skates', 'No account'] },
      de: { tagline: 'Der GPS-Tracker für<br><em>alles, was rollt</em>',
            chips: ['Longboard', 'Skateboard', 'Inline-Skates', 'Ohne Konto'] },
    };
    const lang = new URLSearchParams(location.search).get('lang') || 'en';
    document.documentElement.lang = lang;
    document.getElementById('img1').src = `screens/raw/${lang}_light_04_history.png`;
    document.getElementById('img2').src = `screens/raw/${lang}_dark_07_track.png`;
    document.getElementById('tagline').innerHTML = copy[lang].tagline;
    document.getElementById('chips').innerHTML =
      copy[lang].chips.map(c => `<span class="chip">${c}</span>`).join('');
  </script>
</body>
</html>
