# Compares store/play (texts, screenshots, feature graphic, icon) with the Play listing
# (tool/play_listing_sync.py) and updates only what differs; images are compared by
# SHA-256, so nothing is uploaded when nothing is new. Manual trigger only. "apply" is
# off by default: a run then only prints the differences and commits nothing.
# Needs the PLAY_SERVICE_ACCOUNT_JSON secret (docs/android-release.md, CI secrets); the
# service account also needs the right to manage the store presence.
name: Play listing sync

on:
  # TEMPORARY: dry-run test from the branch (dispatch needs the file on main). Remove before the merge.
  push:
    branches: [ci/android]
    paths: [".github/workflows/play-listing-sync.yml", "tool/play_listing_sync.py", "store/play/**"]
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the differences to the Play listing (off = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-listing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check the secret
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is missing (docs/android-release.md → CI secrets)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the texts and images first
        run: python3 -I tool/store_check.py

      - name: Compare with the Play listing
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          umask 077
          file="${RUNNER_TEMP}/play-account.json"
          printf '%s' "${PLAY_SERVICE_ACCOUNT_JSON}" > "${file}"
          export PLAY_SERVICE_ACCOUNT_FILE="${file}"
          if [ "${APPLY}" = "true" ]; then
            python3 -I tool/play_listing_sync.py --apply
          else
            python3 -I tool/play_listing_sync.py
          fi
          rm -f "${file}"
