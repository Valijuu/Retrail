# Android build gate: proves that the Gradle project, the manifest and the plugins
# still build into a debug APK. ci.yml checks the Dart side only; the signed release
# build (android-release.yml) runs by hand. Nothing here uses a secret, and the APK
# is not kept as an artifact: the repo is public.
name: Android CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**", "ci/**"]
    paths:
      - "android/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.3
          cache: true

      - run: flutter pub get

      # No key.properties on the runner: the Gradle config falls back to the debug
      # key for release, and the debug build never needs the upload key.
      - name: Build the debug APK
        run: flutter build apk --debug
