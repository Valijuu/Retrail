# App Store screenshots from the iOS Simulator on a macOS runner — there is no
# Mac (docs/app-store.md). Manual trigger only. The shots show the invented demo
# rides on Tempelhofer Feld (tool/demo_rides), never real location data, so the
# artifact needs no encryption (unlike the sideload build in ios-build.yml).
name: iOS screenshots

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Language_theme variants to take, space separated (all four by default)"
        default: "en_light en_dark de_light de_dark"

permissions:
  contents: read

concurrency:
  group: ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # macos-26 for the same Xcode 26 reason as ios-build.yml.
    runs-on: macos-26
    # Four runs of the screenshot integration test, each with its own build.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.3
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - run: flutter pub get

      # Rides with titles in the shot's language, plus followed rides for the
      # comparison sheet. Writes build/demo_rides/retrail_<lang>.sqlite.
      - name: Build demo databases
        run: |
          set -euo pipefail
          RETRAIL_DEMO_FOLLOWS=1 RETRAIL_DEMO_LANG=en flutter test tool/demo_rides/build_demo_db_test.dart
          RETRAIL_DEMO_FOLLOWS=1 RETRAIL_DEMO_LANG=de flutter test tool/demo_rides/build_demo_db_test.dart

      # Simulator builds are debug only; release is not supported there.
      - name: Build simulator app
        run: flutter build ios --simulator --debug

      - name: Take screenshots
        env:
          RETRAIL_VARIANTS: ${{ inputs.variants }}
        run: |
          set -uo pipefail
          # Every variant runs even when one fails; the step fails at the end.
          failed=""
          # One variant hung in simctl for 75 minutes (run 42645130114) and took
          # the whole 100-minute job with it: each variant gets 30 minutes.
          # Variants come from an input: pass them through the environment and
          # accept only the four known names, never raw text in the script.
          for variant in ${RETRAIL_VARIANTS:-en_light en_dark de_light de_dark}; do
            case "${variant}" in en_light|en_dark|de_light|de_dark) ;; *) echo "unknown variant: ${variant}" >&2; exit 1 ;; esac
            lang="${variant%_*}" theme="${variant#*_}"
            perl -e 'alarm 1800; exec @ARGV' tool/ios_screenshots.sh "${lang}" "${theme}" build/ios_screenshots \
              || failed="${failed} ${variant}"
          done
          if [ -n "${failed}" ]; then echo "failed variants:${failed}" >&2; exit 1; fi

      # Also on failure: the shots show what went wrong.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrail-ios-screenshots-${{ github.run_number }}
          path: build/ios_screenshots/*.png
          retention-days: 7
          if-no-files-found: warn
